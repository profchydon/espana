<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Surface + hover lift" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:24px;background:var(--bg-page);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.surface{background:#fff;border:1px solid var(--black-100);border-radius:12px;padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px}
.surface.hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.eyebrow{font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ginger-600)}
.title{font:700 18px var(--font-sans);letter-spacing:-.01em;color:var(--black-900)}
.copy{font:500 13px var(--font-body);letter-spacing:-.004em;color:var(--black-400);line-height:1.5}
</style></head>
<body><div class="card">
<div class="surface"><div class="eyebrow">Resting</div><div class="title">Quiet by default</div><div class="copy">1px hairline border in black-100, shadow-sm, 12px radius. Surfaces stay calm so content carries the warmth.</div></div>
<div class="surface hover"><div class="eyebrow">Hover</div><div class="title">Lifts on hover</div><div class="copy">Shadow steps up to md, translateY -2px. No scale, no glow. 240ms ease-out.</div></div>
</div></body></html>
