<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="fg / bg / brand / status tokens" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:20px 24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tok{display:flex;flex-direction:column;gap:6px}
.chip{height:46px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}
.k{font:600 12px var(--font-sans);letter-spacing:-.01em;color:var(--black-700)}
.v{font:500 10px var(--font-mono);color:var(--black-300)}
</style></head>
<body><div class="card">
<div class="grid">
  <div class="tok"><div class="chip" style="background:var(--bg-page)"></div><div class="k">bg-page</div><div class="v">#FAFAFA</div></div>
  <div class="tok"><div class="chip" style="background:var(--bg-surface);border-color:var(--border-subtle)"></div><div class="k">bg-surface</div><div class="v">#FFFFFF</div></div>
  <div class="tok"><div class="chip" style="background:var(--fg-primary)"></div><div class="k">fg-primary</div><div class="v">black-900</div></div>
  <div class="tok"><div class="chip" style="background:var(--fg-secondary)"></div><div class="k">fg-secondary</div><div class="v">black-400</div></div>
  <div class="tok"><div class="chip" style="background:var(--brand-primary)"></div><div class="k">brand-primary</div><div class="v">ginger-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--brand-accent)"></div><div class="k">brand-accent</div><div class="v">iris-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--brand-warm)"></div><div class="k">brand-warm</div><div class="v">sunshine-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--status-success)"></div><div class="k">success</div><div class="v">green-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--status-warning)"></div><div class="k">warning</div><div class="v">sunshine-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--status-danger)"></div><div class="k">danger</div><div class="v">red-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--border-default)"></div><div class="k">border-default</div><div class="v">black-200</div></div>
  <div class="tok"><div class="chip" style="background:var(--bg-inverse)"></div><div class="k">bg-inverse</div><div class="v">black-900</div></div>
</div>
</div></body></html>
