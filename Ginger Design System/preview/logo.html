<!doctype html>
<!-- @dsCard group="Brand" name="Logo (placeholder)" subtitle="Wordmark + app icon — placeholder" viewport="700x230" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--font-display);font-weight:900;letter-spacing:-.02em;color:var(--ginger-500);font-size:64px;line-height:1}
.brand .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sunshine-500);margin-left:2px;vertical-align:top;margin-top:14px}
.tag{font:500 12px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--black-400)}
.row{display:flex;align-items:center;justify-content:space-between}
.mark{display:flex;align-items:center;gap:10px}
.mark-g{width:36px;height:36px;border-radius:10px;background:var(--ginger-500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:24px}
.wm{font:700 18px var(--font-sans);letter-spacing:-.01em;color:var(--black-900)}
</style></head>
<body><div class="card">
<div class="row"><div class="brand">Ginger<span class="dot"></span></div><div class="tag">Wordmark · placeholder</div></div>
<div class="row"><div class="mark"><div class="mark-g">G</div><div class="wm">Ginger</div></div><div class="tag">App icon · lockup</div></div>
</div></body></html>
