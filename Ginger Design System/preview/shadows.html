<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="shadow-sm · md · lg" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:30px 24px;background:var(--bg-page);display:flex;gap:24px;align-items:center;justify-content:space-around}
.tile{display:flex;flex-direction:column;align-items:center;gap:14px}
.box{width:130px;height:80px;background:#fff;border-radius:12px}
.k{font:600 12px var(--font-sans);color:var(--black-700)}
.v{font:500 11px var(--font-mono);color:var(--black-300);text-align:center;max-width:170px;line-height:1.4}
</style></head>
<body><div class="card">
<div class="tile"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="k">shadow-sm</div><div class="v">resting cards</div></div>
<div class="tile"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="k">shadow-md</div><div class="v">menus, popovers, hover</div></div>
<div class="tile"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="k">shadow-lg</div><div class="v">modals, dialogs</div></div>
</div></body></html>
