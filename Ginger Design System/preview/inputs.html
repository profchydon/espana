<!doctype html>
<!-- @dsCard group="Components" name="Form inputs" subtitle="Text · select · error state" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:24px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
label{font:500 12px var(--font-body);letter-spacing:-.004em;color:var(--black-700)}
input,textarea,select{font:500 14px var(--font-body);letter-spacing:-.004em;color:var(--black-900);padding:11px 14px;border:1px solid var(--black-200);border-radius:8px;background:#fff;outline:none;transition:border-color 160ms,box-shadow 160ms}
input:focus,textarea:focus,select:focus{border-color:var(--ginger-500);box-shadow:0 0 0 3px rgba(229,74,36,.18)}
.help{font:500 11px var(--font-body);color:var(--black-300)}
.err input{border-color:var(--red-500)}
.err .help{color:var(--red-600)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head>
<body><div class="card">
<div class="row">
<div class="field"><label>Name</label><input value="Ada Lovelace"></div>
<div class="field"><label>Email</label><input placeholder="you@ginger.io"></div>
</div>
<div class="row">
<div class="field err"><label>Phone</label><input value="555-12"><div class="help">Add the rest of the digits.</div></div>
<div class="field"><label>Role</label><select><option>Designer</option></select></div>
</div>
</div></body></html>
