<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm · md · lg · xl · pill" viewport="700x190" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:28px 24px;display:flex;gap:20px;align-items:flex-end;justify-content:space-around}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:90px;height:90px;background:var(--ginger-100);border:1px solid var(--ginger-300)}
.k{font:600 12px var(--font-sans);color:var(--black-700)}
.v{font:500 11px var(--font-mono);color:var(--black-300)}
</style></head>
<body><div class="card">
<div class="tile"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="k">sm</div><div class="v">4px</div></div>
<div class="tile"><div class="box" style="border-radius:var(--radius-md)"></div><div class="k">md · button</div><div class="v">8px</div></div>
<div class="tile"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="k">lg · card</div><div class="v">12px</div></div>
<div class="tile"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="k">xl · modal</div><div class="v">16px</div></div>
<div class="tile"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="k">pill</div><div class="v">9999px</div></div>
</div></body></html>
