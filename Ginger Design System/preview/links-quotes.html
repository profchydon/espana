<!doctype html>
<!-- @dsCard group="Components" name="Links & quotes" subtitle="Anchor styles · editorial pull-quote" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card{padding:24px;display:flex;flex-direction:column;gap:12px}
.label{font:500 10px var(--font-mono);color:var(--black-300);text-transform:uppercase;letter-spacing:.06em}
a{font:600 14px var(--font-body);letter-spacing:-.004em;color:var(--ginger-600);text-decoration:none;transition:all 160ms cubic-bezier(.2,.8,.2,1)}
a:hover{text-decoration:underline}
.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.muted{color:var(--black-400)}
.q{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--black-900);letter-spacing:-.01em;line-height:1.3;border-left:3px solid var(--ginger-500);padding-left:14px}
</style></head>
<body><div class="card">
<div class="label">Links</div>
<div class="row"><a href="#">Continue reading →</a><a href="#" class="muted">Secondary link</a><a href="#" style="color:var(--iris-600)">Iris accent link</a></div>
<div class="label" style="margin-top:6px">Editorial pull-quote</div>
<div class="q">"The warmth comes from the palette itself — not from gradients or noise."</div>
</div></body></html>
